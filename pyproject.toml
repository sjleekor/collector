[project]
name = "collector"
version = "0.14.1"
description = "Market data collection pipeline: source access, ingestion, cleaning, and point-in-time storage."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyarrow>=15",               # parquet
    "duckdb>=1.5",               # parquet 위 SQL
    "pandas>=2.0",
    # 미국
    "edgartools>=5.57",          # SEC 공시·재무 (MIT)
    "fredapi>=0.5.2",            # 거시 + vintage (Apache-2.0)
    "exchange-calendars>=4.13",  # 거래소 캘린더 (Apache-2.0)
    "requests-cache>=1.3",       # HTTP 캐시 — 원천 보호
    "tenacity>=9.1",             # 재시도 (403 제외)
    "pandera>=0.33",             # 스키마 검증
    # 한국
    "finance-datareader>=0.9.110",
    "pykrx>=1.2.8",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "pytest>=8.0",
    "pandas-stubs~=2.3.3",
]

[project.scripts]
collector = "collector.cli.app:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]
